<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDeepSeek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1e1e2e;
            color: #e5e7eb;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        /* 侧边栏 */
        .sidebar {
            width: 260px;
            background-color: #11111b;
            padding: 12px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #313244;
        }
        .sidebar h2 {
            font-size: 18px;
            margin-bottom:12px;
            padding: 8px 4px;
        }
        .new-chat-btn {
            background-color: #313244;
            border: none;
            color: #fff;
            padding:10px;
            border-radius:8px;
            cursor:pointer;
            margin-bottom:12px;
        }
        .new-chat-btn:hover {
            background-color:#45475a;
        }
        .mode-switch-area{
            display:flex;
            gap:6px;
            margin-bottom:16px;
        }
        .mode-btn{
            flex:1;
            padding:8px 4px;
            border-radius:6px;
            border:1px solid #45475a;
            background:#313244;
            color:#ccc;
            cursor:pointer;
            font-size:13px;
        }
        .mode-btn.active{
            background:#89b4fa;
            color:#111;
            border-color:#89b4fa;
        }
        .session-list {
            flex:1;
            overflow-y:auto;
        }
        .session-item {
            padding: 8px 10px;
            border-radius:6px;
            cursor:pointer;
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:4px;
        }
        .session-item:hover {
            background-color:#313244;
        }
        .session-item.active {
            background-color:#45475a;
        }
        .del-session {
            color:#f38ba8;
            font-size:14px;
        }
        .api-config-area {
            margin-top:12px;
            padding-top:12px;
            border-top:1px solid #313244;
        }
        .api-config-area input {
            width:100%;
            background:#313244;
            border:1px solid #45475a;
            color:#fff;
            padding:8px;
            border-radius:6px;
        }
        /* 主聊天区域 */
        .main {
            flex:1;
            display:flex;
            flex-direction:column;
            height:100vh;
        }
        .chat-container {
            flex:1;
            overflow-y:auto;
            padding:16px;
        }
        .message {
            max-width: 95%;
            margin-bottom:16px;
            line-height:1.6;
        }
        .user-msg {
            background-color:#313244;
            padding:12px 16px;
            border-radius:10px;
            margin-left:auto;
            width:fit-content;
            max-width:95%;
        }
        .ai-msg {
            padding:12px 16px;
            white-space:pre-wrap;
        }
        .input-area {
            padding:12px 16px;
            border-top:1px solid #313244;
            display:flex;
            gap:8px;
        }
        textarea {
            flex:1;
            background:#313244;
            color:#fff;
            border:1px solid #45475a;
            border-radius:8px;
            padding:10px;
            resize:none;
            height:52px;
            font-size:15px;
        }
        #sendBtn {
            width:70px;
            background:#89b4fa;
            border:none;
            border-radius:8px;
            cursor:pointer;
            color:#111;
            font-weight:bold;
        }
        #sendBtn:disabled {
            background:#45475a;
            color:#aaa;
            cursor:not-allowed;
        }
        /* 移动端适配 */
        @media(max-width:720px){
            .sidebar {
                position:absolute;
                z-index:10;
                height:100%;
                transform:translateX(-100%);
                transition:0.2s;
            }
            .sidebar.show{
                transform:translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <h2>MyDeepSeek</h2>
        <button class="new-chat-btn" id="newChatBtn">+ 新建对话</button>

        <div class="mode-switch-area">
            <button class="mode-btn" id="modeFast">快速模式</button>
            <button class="mode-btn" id="modeExpert">专家模式</button>
        </div>

        <div class="session-list" id="sessionList"></div>
        <div class="api-config-area">
            <input type="password" id="apiKeyInput" placeholder="填入 DeepSeek API Key">
        </div>
    </div>

    <div class="main">
        <div class="chat-container" id="chatBox"></div>
        <div class="input-area">
            <textarea id="promptInput" placeholder="输入消息，Shift+Enter换行"></textarea>
            <button id="sendBtn">发送</button>
        </div>
    </div>

<script>
const STORAGE_KEY = "mydeepseek_data";

// 两套系统提示词，对齐原版逻辑
const SYSTEM_PROMPTS = {
    fast: "你是快速助手。回答尽量简短精炼，直奔主题，去掉多余铺垫，直接给出答案，语言简洁。",
    expert: "你是专家模式，深度思考。回答完整、详细，多角度分析，必要时拆解步骤、解释原理，输出充分详实内容。"
};

let state = {
    sessions:[],
    currentSessionId:null,
    apiKey:"",
    globalMode:"fast" // 默认快速模式
};

// 读取本地存储
function loadLocal(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
        state = JSON.parse(raw);
    }
    document.getElementById("apiKeyInput").value = state.apiKey || "";
    renderSessionList();
    updateModeUI();
    if(state.currentSessionId){
        renderChat(state.currentSessionId);
    }
}
function saveLocal(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// 更新模式按钮高亮
function updateModeUI(){
    document.getElementById("modeFast").classList.toggle("active", state.globalMode === "fast");
    document.getElementById("modeExpert").classList.toggle("active", state.globalMode === "expert");
}

// 创建会话，继承当前选择的模式
function createSession(){
    const sid = Date.now().toString();
    state.sessions.push({
        id:sid,
        title:"新对话",
        mode: state.globalMode, // 每个会话记录自己的模式
        messages:[]
    });
    state.currentSessionId = sid;
    saveLocal();
    renderSessionList();
    renderChat(sid);
}

// 删除会话
function deleteSession(sid){
    state.sessions = state.sessions.filter(s=>s.id!==sid);
    if(state.currentSessionId === sid){
        state.currentSessionId = state.sessions.length>0 ? state.sessions[0].id : null;
    }
    saveLocal();
    renderSessionList();
    if(state.currentSessionId) renderChat(state.currentSessionId);
    else document.getElementById("chatBox").innerHTML = "";
}

// 渲染会话侧边栏
function renderSessionList(){
    const el = document.getElementById("sessionList");
    el.innerHTML = "";
    state.sessions.forEach(s=>{
        const div = document.createElement("div");
        div.className = "session-item" + (state.currentSessionId===s.id?" active":"");
        const modeTag = s.mode==="expert"?"【专家】":"";
        div.innerHTML = `<span class="title-text">${escapeHtml(modeTag + s.title)}</span> <span class="del-session">×</span>`;
        div.querySelector(".title-text").onclick = ()=>{
            state.currentSessionId = s.id;
            // 切会话时同步全局模式为此会话的模式
            const curSes = state.sessions.find(x=>x.id===state.currentSessionId);
            state.globalMode = curSes.mode;
            updateModeUI();
            saveLocal();
            renderSessionList();
            renderChat(state.currentSessionId);
        }
        div.querySelector(".del-session").onclick = (e)=>{
            e.stopPropagation();
            deleteSession(s.id);
        }
        el.appendChild(div);
    })
}

// html转义
function escapeHtml(str){
    if(!str) return "";
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// 渲染聊天记录
function renderChat(sid){
    const ses = state.sessions.find(x=>x.id===sid);
    const box = document.getElementById("chatBox");
    box.innerHTML = "";
    if(!ses) return;
    ses.messages.forEach(m=>{
        appendMessage(m.role, m.content, false);
    })
    box.scrollTop = box.scrollHeight;
}

// 追加一条消息到页面
function appendMessage(role, content, isStream=true){
    const box = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.className = role==="user" ? "message user-msg" : "message ai-msg";
    div.dataset.role = role;
    div.innerText = content;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
}

// 更新会话标题（取第一条用户消息）
function updateSessionTitle(sid, userText){
    const s = state.sessions.find(x=>x.id===sid);
    if(s && s.title==="新对话"){
        s.title = userText.slice(0,24);
        saveLocal();
        renderSessionList();
    }
}

// 流式请求 deepseek
async function sendMessage(){
    const apiKey = document.getElementById("apiKeyInput").value.trim();
    const promptEl = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const text = promptEl.value.trim();
    if(!text) return;
    if(!apiKey){
        alert("请先填写DeepSeek API Key");
        return;
    }
    if(!state.currentSessionId){
        createSession();
    }
    const ses = state.sessions.find(x=>x.id===state.currentSessionId);
    ses.messages.push({role:"user", content:text});
    updateSessionTitle(ses.id, text);
    saveLocal();
    renderChat(ses.id);
    promptEl.value = "";
    sendBtn.disabled = true;

    // 组装消息：带上对应模式的 system prompt
    const history = [{role:"system", content: SYSTEM_PROMPTS[ses.mode]}];
    ses.messages.forEach(m=>{
        history.push({role:m.role, content:m.content});
    });

    let aiDiv = appendMessage("assistant", "");
    let fullResp = "";

    try{
        const resp = await fetch("https://api.deepseek.com/v1/chat/completions",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":`Bearer ${apiKey}`
            },
            body:JSON.stringify({
                model:"deepseek-chat",
                messages:history,
                stream:true
            })
        })
        if(!resp.ok){
            throw new Error("接口错误 "+resp.status);
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder("utf-8");
        while(true){
            const {done, value} = await reader.read();
            if(done) break;
            const chunk = decoder.decode(value);
            const lines = chunk.split("\n").filter(line=>line.startsWith("data: ") && line.trim()!=='data: [DONE]');
            for(let line of lines){
                const jsonStr = line.replace("data: ","");
                try{
                    const obj = JSON.parse(jsonStr);
                    const delta = obj.choices?.[0]?.delta?.content;
                    if(delta){
                        fullResp += delta;
                        aiDiv.innerText = fullResp;
                        document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight;
                    }
                }catch(e){}
            }
        }
        ses.messages.push({role:"assistant", content:fullResp});
        saveLocal();
    }catch(err){
        aiDiv.innerText = "请求失败："+err.message+"\n检查网络、API‑key、余额";
    }
    sendBtn.disabled = false;
}

// 模式切换事件
document.getElementById("modeFast").onclick = function(){
    state.globalMode = "fast";
    updateModeUI();
    saveLocal();
}
document.getElementById("modeExpert").onclick = function(){
    state.globalMode = "expert";
    updateModeUI();
    saveLocal();
}

// 事件绑定
document.getElementById("newChatBtn").onclick = createSession;
document.getElementById("sendBtn").onclick = sendMessage;
document.getElementById("promptInput").onkeydown = function(e){
    if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendMessage();
    }
}
document.getElementById("apiKeyInput").oninput = function(){
    state.apiKey = this.value.trim();
    saveLocal();
}

// 初始化
loadLocal();
if(state.sessions.length===0){
    createSession();
}
</script>
</body>
</html>
