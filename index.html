<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>DeepSeek AI 聊天</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --surface2: #f9fafb;
            --border: #e5e7eb;
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --header-bg: #1a1a2e;
            --header-text: #ffffff;
            --bubble-user: #2563eb;
            --bubble-user-text: #ffffff;
            --bubble-ai: #ffffff;
            --bubble-ai-text: #1a1a2e;
            --shadow: rgba(0,0,0,0.08);
        }
        
        [data-theme="dark"] {
            --bg: #111827;
            --surface: #1f2937;
            --surface2: #1a2332;
            --border: #374151;
            --text: #f3f4f6;
            --text-secondary: #9ca3af;
            --header-bg: #0f172a;
            --header-text: #ffffff;
            --bubble-user: #2563eb;
            --bubble-user-text: #ffffff;
            --bubble-ai: #1f2937;
            --bubble-ai-text: #f3f4f6;
            --shadow: rgba(0,0,0,0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            position: fixed;
            top: 0;
            left: 0;
            transition: background 0.3s, color 0.3s;
        }
        
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 10px 12px;
            padding-top: calc(10px + env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 6px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex: 1;
        }
        
        .menu-btn {
            background: none;
            border: none;
            color: var(--header-text);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
        }
        
        .header-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        
        .header-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        
        .theme-btn {
            background: none;
            border: none;
            color: var(--header-text);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }
        
        .new-chat-btn {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .api-status {
            font-size: 10px;
            color: #4ade80;
            text-align: center;
            padding: 3px 0;
            background: #16213e;
            flex-shrink: 0;
        }
        
        .settings-bar {
            padding: 6px 8px;
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--text-secondary);
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            width: 100%;
        }
        
        .settings-bar label {
            font-size: 10px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .settings-bar input {
            flex: 1;
            min-width: 0;
            padding: 5px 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 10px;
            outline: none;
            background: var(--surface);
            color: var(--text);
        }
        
        .settings-bar select {
            padding: 5px 2px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 10px;
            background: var(--surface);
            color: var(--text);
            width: 70px;
            flex-shrink: 0;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative;
        }
        
        .sidebar {
            position: absolute;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background: var(--surface);
            z-index: 100;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
        }
        
        .sidebar.open {
            left: 0;
        }
        
        .sidebar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 99;
            display: none;
        }
        
        .sidebar-overlay.show {
            display: block;
        }
        
        .sidebar-header {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            color: var(--text);
        }
        
        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
        }
        
        .close-sidebar {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        
        .chat-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 6px;
        }
        
        .chat-item {
            padding: 9px 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
            transition: background 0.15s;
            color: var(--text);
        }
        
        .chat-item:active {
            background: var(--border);
        }
        
        .chat-item.active {
            background: rgba(37, 99, 235, 0.15);
        }
        
        .chat-item-title {
            flex: 1;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        
        .chat-item-btn {
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 3px;
            color: var(--text-secondary);
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            width: 100%;
        }
        
        .message {
            max-width: 85%;
            padding: 10px 13px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 13px;
            word-wrap: break-word;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
        }
        
        .message.user {
            align-self: flex-end;
            background: var(--bubble-user);
            color: var(--bubble-user-text);
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant {
            align-self: flex-start;
            background: var(--bubble-ai);
            color: var(--bubble-ai-text);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px var(--shadow);
        }
        
        .message.system {
            align-self: center;
            background: var(--border);
            color: var(--text-secondary);
            font-size: 11px;
            padding: 7px 10px;
            text-align: center;
            border-radius: 10px;
            max-width: 90%;
            white-space: pre-wrap;
        }
        
        .input-container {
            display: flex;
            gap: 6px;
            padding: 8px 10px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
            background: var(--surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            width: 100%;
        }
        
        #messageInput {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 18px;
            font-size: 13px;
            outline: none;
            min-width: 0;
            background: var(--bg);
            color: var(--text);
        }
        
        #messageInput:focus {
            border-color: #2563eb;
        }
        
        #sendBtn {
            padding: 9px 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 50px;
        }
        
        #sendBtn:active {
            background: #1d4ed8;
        }
        
        #sendBtn:disabled {
            background: #9ca3af;
        }
        
        #sendBtn.stop-btn {
            background: #ef4444;
        }
        
        .action-bar {
            display: flex;
            gap: 5px;
            padding: 5px 8px;
            background: var(--surface2);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            overflow-x: auto;
        }
        
        .action-btn {
            padding: 4px 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 10px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-secondary);
        }
        
        .action-btn:active {
            background: var(--border);
        }
        
        .loading-dots {
            display: inline-flex;
            gap: 3px;
            align-items: center;
        }
        
        .loading-dots span {
            width: 5px;
            height: 5px;
            background: #2563eb;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
            30% { transform: translateY(-5px); opacity: 1; }
        }
        
        .error-msg {
            color: #ef4444 !important;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: var(--surface);
            border-radius: 14px;
            padding: 18px;
            width: 85%;
            max-width: 350px;
            color: var(--text);
        }
        
        .modal-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .modal-input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            margin-bottom: 12px;
            background: var(--bg);
            color: var(--text);
        }
        
        .modal-btns {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }
        
        .modal-btn {
            padding: 7px 14px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .modal-btn.cancel {
            background: var(--border);
            color: var(--text);
        }
        
        .modal-btn.confirm {
            background: #2563eb;
            color: white;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <span class="header-title" id="headerTitle">对话</span>
            </div>
            <div class="header-actions">
                <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
                <button class="new-chat-btn" onclick="newChat()">+ 新对话</button>
            </div>
        </div>
        <div class="api-status" id="apiStatus">未设置 API Key</div>
        
        <div class="settings-bar">
            <label>Key:</label>
            <input type="password" id="apiKey" placeholder="粘贴API Key" 
                   oninput="saveApiKey(this.value)" autocomplete="off">
            <select id="modelSelect" onchange="saveModel(this.value)">
                <option value="deepseek-chat">chat</option>
                <option value="deepseek-reasoner">reasoner</option>
            </select>
        </div>
        
        <div class="main-content">
            <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <span class="sidebar-title">对话列表</span>
                    <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
                </div>
                <div class="chat-list" id="chatList"></div>
            </div>
            
            <div class="chat-container" id="chatContainer">
                <div class="message system">点击 ☰ 管理对话，或直接开始聊天</div>
            </div>
        </div>
        
        <div class="action-bar">
            <button class="action-btn" onclick="renameChat()">✏️ 重命名</button>
            <button class="action-btn" onclick="clearChat()">🗑️ 清空</button>
            <button class="action-btn" onclick="exportChat()">📤 导出</button>
            <button class="action-btn" onclick="deleteChat()">❌ 删除</button>
        </div>
        
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="输入消息..." 
                   onkeypress="if(event.key==='Enter') sendMessage()" autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>
    
    <div class="modal" id="renameModal">
        <div class="modal-content">
            <div class="modal-title">重命名对话</div>
            <input type="text" class="modal-input" id="renameInput" placeholder="输入新名称">
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeRename()">取消</button>
                <button class="modal-btn confirm" onclick="confirmRename()">确定</button>
            </div>
        </div>
    </div>

    <script>
        let chats = [];
        let currentChatId = null;
        let currentAbortController = null;
        
        window.onload = function() {
            loadChats();
            loadSettings();
            loadTheme();
            renderChatList();
            if (chats.length === 0) {
                newChat();
            } else {
                currentChatId = chats[0].id;
                renderMessages();
            }
            updateHeader();
            renderChatList();
        };
        
        function loadSettings() {
            const savedKey = localStorage.getItem('deepseek_api_key');
            const savedModel = localStorage.getItem('deepseek_model');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
                updateApiStatus(true);
            }
            if (savedModel) {
                document.getElementById('modelSelect').value = savedModel;
            }
        }
        
        function loadTheme() {
            const theme = localStorage.getItem('deepseek_theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeBtn').textContent = '☀️';
            }
        }
        
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            if (current === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeBtn').textContent = '🌙';
                localStorage.setItem('deepseek_theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeBtn').textContent = '☀️';
                localStorage.setItem('deepseek_theme', 'dark');
            }
        }
        
        function saveApiKey(key) {
            localStorage.setItem('deepseek_api_key', key);
            updateApiStatus(!!key);
        }
        
        function saveModel(model) {
            localStorage.setItem('deepseek_model', model);
        }
        
        function updateApiStatus(hasKey) {
            const statusEl = document.getElementById('apiStatus');
            statusEl.textContent = hasKey ? '✓ API Key 已设置' : '未设置 API Key';
            statusEl.style.color = hasKey ? '#4ade80' : '#f87171';
        }
        
        function loadChats() {
            const saved = localStorage.getItem('deepseek_chats');
            if (saved) {
                try {
                    chats = JSON.parse(saved);
                } catch(e) {
                    chats = [];
                }
            }
        }
        
        function saveChats() {
            localStorage.setItem('deepseek_chats', JSON.stringify(chats));
        }
        
        function newChat() {
            const chat = {
                id: Date.now().toString(),
                title: '新对话',
                messages: [],
                createdAt: new Date().toISOString()
            };
            chats.unshift(chat);
            currentChatId = chat.id;
            saveChats();
            renderChatList();
            renderMessages();
            updateHeader();
            toggleSidebar(false);
        }
        
        function switchChat(id) {
            currentChatId = id;
            renderChatList();
            renderMessages();
            updateHeader();
            toggleSidebar(false);
        }
        
        function getCurrentChat() {
            return chats.find(function(c) { return c.id === currentChatId; });
        }
        
        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            chats.forEach(function(chat) {
                const item = document.createElement('div');
                item.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
                item.onclick = function() { switchChat(chat.id); };
                
                const title = document.createElement('span');
                title.className = 'chat-item-title';
                title.textContent = chat.title;
                
                const actions = document.createElement('div');
                actions.className = 'chat-item-actions';
                
                const renameBtn = document.createElement('button');
                renameBtn.className = 'chat-item-btn';
                renameBtn.textContent = '✏️';
                renameBtn.onclick = function(e) {
                    e.stopPropagation();
                    currentChatId = chat.id;
                    showRenameModal();
                };
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'chat-item-btn';
                deleteBtn.textContent = '🗑️';
                deleteBtn.onclick = function(e) {
                    e.stopPropagation();
                    if (confirm('删除这个对话？')) {
                        const index = chats.findIndex(function(c) { return c.id === chat.id; });
                        chats.splice(index, 1);
                        if (currentChatId === chat.id) {
                            currentChatId = chats.length > 0 ? chats[0].id : null;
                        }
                        saveChats();
                        renderChatList();
                        if (currentChatId) {
                            renderMessages();
                            updateHeader();
                        } else {
                            newChat();
                        }
                    }
                };
                
                actions.appendChild(renameBtn);
                actions.appendChild(deleteBtn);
                item.appendChild(title);
                item.appendChild(actions);
                list.appendChild(item);
            });
        }
        
        function renderMessages() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
            const chat = getCurrentChat();
            if (!chat) return;
            
            if (chat.messages.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'message system';
                empty.textContent = '开始新对话吧！';
                container.appendChild(empty);
            } else {
                chat.messages.forEach(function(msg) {
                    addMessageToDOM(msg.content, msg.role);
                });
            }
            scrollToBottom();
        }
        
        function addMessageToDOM(content, role) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + role;
            msgDiv.textContent = content;
            container.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }
        
        function addMessage(content, role) {
            const chat = getCurrentChat();
            if (!chat) return;
            chat.messages.push({ content: content, role: role, timestamp: Date.now() });
            if (chat.title === '新对话' && role === 'user') {
                chat.title = content.substring(0, 20).replace(/\n/g, ' ');
            }
            saveChats();
            addMessageToDOM(content, role);
            renderChatList();
            updateHeader();
        }
        
        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            requestAnimationFrame(function() {
                container.scrollTop = container.scrollHeight;
            });
        }
        
        function updateHeader() {
            const chat = getCurrentChat();
            document.getElementById('headerTitle').textContent = chat ? chat.title : '对话';
        }
        
        function toggleSidebar(force) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (force !== undefined) {
                sidebar.classList.toggle('open', force);
                overlay.classList.toggle('show', force);
            } else {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('show');
            }
        }
        
        function showRenameModal() {
            const chat = getCurrentChat();
            if (!chat) return;
            document.getElementById('renameInput').value = chat.title;
            document.getElementById('renameModal').classList.add('show');
            setTimeout(function() { document.getElementById('renameInput').focus(); }, 100);
        }
        
        function closeRename() {
            document.getElementById('renameModal').classList.remove('show');
        }
        
        function confirmRename() {
            const newTitle = document.getElementById('renameInput').value.trim();
            if (newTitle) {
                const chat = getCurrentChat();
                if (chat) {
                    chat.title = newTitle;
                    saveChats();
                    renderChatList();
                    updateHeader();
                }
            }
            closeRename();
        }
        
        function renameChat() {
            if (!getCurrentChat()) return;
            showRenameModal();
        }
        
        function clearChat() {
            const chat = getCurrentChat();
            if (!chat) return;
            if (confirm('清空当前对话的所有消息？')) {
                chat.messages = [];
                saveChats();
                renderMessages();
            }
        }
        
        function deleteChat() {
            const chat = getCurrentChat();
            if (!chat) return;
            if (confirm('删除当前对话？')) {
                const index = chats.findIndex(function(c) { return c.id === chat.id; });
                chats.splice(index, 1);
                currentChatId = chats.length > 0 ? chats[0].id : null;
                saveChats();
                renderChatList();
                if (currentChatId) {
                    renderMessages();
                    updateHeader();
                } else {
                    newChat();
                }
            }
        }
        
        function exportChat() {
            const chat = getCurrentChat();
            if (!chat || chat.messages.length === 0) {
                alert('没有可导出的内容');
                return;
            }
            let text = '对话标题: ' + chat.title + '\n';
            text += '导出时间: ' + new Date().toLocaleString() + '\n';
            text += '========================================\n\n';
            chat.messages.forEach(function(msg) {
                text += '[' + (msg.role === 'user' ? '我' : 'AI') + ']: ' + msg.content + '\n\n';
            });
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(function() {
                    alert('对话已复制到剪贴板');
                }).catch(function() {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }
        
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('对话已复制到剪贴板');
        }
        
        function stopGeneration() {
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('modelSelect').value;
            
            if (!message) return;
            if (!apiKey) {
                alert('请先输入你的 DeepSeek API Key');
                return;
            }
            if (!getCurrentChat()) {
                newChat();
            }
            
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = '⏹';
            sendBtn.className = 'stop-btn';
            sendBtn.onclick = stopGeneration;
            input.value = '';
            input.blur();
            
            addMessage(message, 'user');
            
            const chat = getCurrentChat();
            const aiMsgDiv = addMessageToDOM('', 'assistant');
            aiMsgDiv.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
            
            currentAbortController = new AbortController();
            
            try {
                const messages = chat.messages.filter(function(m) {
                    return m.role !== 'system' && m.content.indexOf('错误:') !== 0;
                }).map(function(m) {
                    return { role: m.role, content: m.content };
                });
                
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: messages,
                        stream: true,
                        max_tokens: 2000,
                        temperature: 0.7
                    }),
                    signal: currentAbortController.signal
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(function() { return {}; });
                    throw new Error(errorData.error && errorData.error.message ? errorData.error.message : '请求失败: ' + response.status);
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                aiMsgDiv.textContent = '';
                
                while (true) {
                    const result = await reader.read();
                    if (result.done) break;
                    
                    const chunk = decoder.decode(result.value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i];
                        if (line.indexOf('data: ') === 0) {
                            const data = line.slice(6).trim();
                            if (data === '[DONE]') continue;
                            try {
                                const parsed = JSON.parse(data);
                                const delta = parsed.choices && parsed.choices[0] && parsed.choices[0].delta;
                                const content = delta ? (delta.content || '') : '';
                                if (content) {
                                    fullText += content;
                                    aiMsgDiv.textContent = fullText;
                                    scrollToBottom();
                                }
                            } catch(e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }
                
                if (fullText) {
                    chat.messages.push({ content: fullText, role: 'assistant', timestamp: Date.now() });
                    saveChats();
                }
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    const partialText = aiMsgDiv.textContent;
                    if (partialText && partialText.indexOf('loading-dots') === -1) {
                        aiMsgDiv.textContent = partialText + '\n\n[已停止生成]';
                        chat.messages.push({ content: partialText + '\n\n[已停止生成]', role: 'assistant', timestamp: Date.now() });
                        saveChats();
                    } else {
                        aiMsgDiv.textContent = '[已停止生成]';
                    }
                } else {
                    aiMsgDiv.textContent = '错误: ' + error.message;
                    aiMsgDiv.classList.add('error-msg');
                    chat.messages.push({ content: '错误: ' + error.message, role: 'assistant', timestamp: Date.now() });
                    saveChats();
                }
            }
            
            currentAbortController = null;
            sendBtn.disabled = false;
            sendBtn.textContent = '发送';
            sendBtn.className = '';
            sendBtn.onclick = sendMessage;
            scrollToBottom();
        }
    </script>
</body>
</html>
