<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>My DeepSeek</title>
<style>
*{margin:0;padding:0;box‑sizing:border‑box;}
body{
    font‑family:‑apple‑system,BlinkMacSystemFont,system‑ui,sans‑serif;
    background:#000000;
    color:#ffffff;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex‑direction:column;
}
/* 顶部导航栏 */
.top‑header{
    height:56px;
    display:flex;
    align‑items:center;
    justify‑content:space‑between;
    padding:0 14px;
    border‑bottom:1px solid #222222;
    flex‑shrink:0;
    z‑index:15;
}
.header‑left{
    font‑size:26px;
    cursor:pointer;
}
.header‑title{
    font‑size:22px;
    font‑weight:500;
}
.header‑right{
    display:flex;
    gap:24px;
    font‑size:24px;
}
.icon‑btn{
    cursor:pointer;
    opacity:0.85;
}
.icon‑btn:hover{opacity:1;}

/* 侧边栏 */
.sidebar{
    position:absolute;
    top:56px;
    left:0;
    width:270px;
    height:calc(100vh‑56px);
    background:#0c0c0e;
    border‑right:1px solid #222;
    transform:translateX(‑100%);
    transition:transform 0.22s ease;
    z‑index:12;
    padding:14px;
    display:flex;
    flex‑direction:column;
}
.sidebar.show{transform:translateX(0);}

.session‑list{
    flex:1;
    overflow‑y:auto;
}
.session‑item{
    padding:10px 10px;
    border‑radius:8px;
    display:flex;
    justify‑content:space‑between;
    align‑items:center;
    margin‑bottom:4px;
    cursor:pointer;
}
.session‑item:hover{background:#1f1f23;}
.session‑item.active{background:#27272e;}
.del‑session{color:#ff7b89;font‑size:14px;}
.api‑config{
    margin‑top:12px;
    padding‑top:12px;
    border‑top:1px solid #222;
}
.api‑config input{
    width:100%;
    background:#1a1a1f;
    border:1px solid #333;
    color:#fff;
    padding:9px;
    border‑radius:8px;
}

/* 主聊天区域 */
.main‑wrap{
    flex:1;
    display:flex;
    flex‑direction:column;
    height:calc(100vh‑56px);
}
.chat‑box{
    flex:1;
    overflow‑y:auto;
    padding:16px;
}
.welcome‑tip{
    height:100%;
    display:flex;
    flex‑direction:column;
    align‑items:center;
    justify‑content:center;
    color:#888;
    font‑size:18px;
    gap:10px;
}
.welcome‑tip a{color:#63a8ff;text‑decoration:none;}

.message{
    max‑width:94%;
    margin‑bottom:18px;
    line‑height:1.65;
    white‑space:pre‑wrap;
}
.user‑msg{
    margin‑left:auto;
    background:#1e1e24;
    padding:12px 16px;
    border‑radius:12px;
    width:fit‑content;
}
.ai‑msg{
    padding:10px 4px;
}

/* 输入控制区 */
.input‑container{
    padding:10px 14px 18px;
    border‑top:1px solid #222;
}
.toggle‑bar{
    display:flex;
    gap:12px;
    margin‑bottom:10px;
}
.toggle‑btn{
    padding:7px 14px;
    border‑radius:20px;
    border:1px solid #334155;
    background:#12151c;
    color:#b8c2cc;
    font‑size:14px;
    cursor:pointer;
    display:flex;
    align‑items:center;
    gap:6px;
}
.toggle‑btn.active{
    border‑color:#4078dd;
    background:#172238;
    color:#93b8ff;
}

.input‑row{
    display:flex;
    gap:10px;
    align‑items:flex‑end;
}
textarea{
    flex:1;
    background:#17171b;
    border:1px solid #2e2e36;
    color:#fff;
    border‑radius:14px;
    padding:14px 16px;
    resize:none;
    min‑height:54px;
    max‑height:140px;
    font‑size:16px;
}
.add‑btn{
    width:50px;
    height:50px;
    border‑radius:50%;
    background:#222;
    border:none;
    color:#fff;
    font‑size:24px;
    flex‑shrink:0;
    cursor:pointer;
}
.add‑btn:disabled{opacity:0.35;cursor:not‑allowed;}

/* 遮罩，打开侧边栏，点击空白关闭 */
.mask{
    position:absolute;
    inset:56px 0 0 0;
    background:rgba(0,0,0,0.45);
    z‑index:11;
    display:none;
}
.mask.show{display:block;}
</style>
</head>
<body>
<div class="top‑header">
    <div class="header‑left icon‑btn" id="menuBtn">☰</div>
    <div class="header‑title">My DeepSeek</div>
    <div class="header‑right">
        <span class="icon‑btn" id="newChatIcon">+</span>
        <span class="icon‑btn">🔍</span>
    </div>
</div>

<div class="mask" id="mask"></div>
<div class="sidebar" id="sidebar">
    <div class="session‑list" id="sessionList"></div>
    <div class="api‑config">
        <input type="password" id="apiKeyInput" placeholder="DeepSeek API Key">
    </div>
</div>

<div class="main‑wrap" id="mainWrap">
    <div class="chat‑box" id="chatBox">
        <div class="welcome‑tip" id="welcomeDom">
            <div>不知道跟DS老师聊什么？</div>
            <a href="#">看看指令市场！</a>
        </div>
    </div>
    <div class="input‑container">
        <div class="toggle‑bar">
            <button class="toggle‑btn" id="toggleThink">
                <span>✦</span>深度思考
            </button>
            <button class="toggle‑btn" id="toggleWeb">
                <span>🖥</span>预览网页
            </button>
        </div>
        <div class="input‑row">
            <textarea id="promptInput" placeholder="输入消息…"></textarea>
            <button class="add‑btn" id="sendBtn">+</button>
        </div>
    </div>
</div>

<script>
const STORAGE_KEY = "mydeepseek_origin";
let state = {
    sessions:[],
    currentSessionId:null,
    apiKey:"",
    thinkMode:false, //深度思考R1开关
    webPreview:false
};
const sidebar = document.getElementById("sidebar");
const mask = document.getElementById("mask");
const chatBox = document.getElementById("chatBox");
const welcomeDom = document.getElementById("welcomeDom");

//侧边栏开关
function openSidebar(){
    sidebar.classList.add("show");
    mask.classList.add("show");
}
function closeSidebar(){
    sidebar.classList.remove("show");
    mask.classList.remove("show");
}
document.getElementById("menuBtn").onclick = openSidebar;
mask.onclick = closeSidebar;

//切换深度思考
document.getElementById("toggleThink").onclick = function(){
    state.thinkMode = !state.thinkMode;
    this.classList.toggle("active", state.thinkMode);
    saveLocal();
}
document.getElementById("toggleWeb").onclick = function(){
    state.webPreview = !state.webPreview;
    this.classList.toggle("active", state.webPreview);
    saveLocal();
}

//本地存储
function loadLocal(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
    document.getElementById("apiKeyInput").value = state.apiKey||"";
    document.getElementById("toggleThink").classList.toggle("active", state.thinkMode);
    document.getElementById("toggleWeb").classList.toggle("active", state.webPreview);
    renderSessionList();
    if(state.currentSessionId){
        renderChat(state.currentSessionId);
    }else{
        welcomeDom.style.display="flex";
    }
}
function saveLocal(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

//新建会话
function createSession(){
    closeSidebar();
    const sid = Date.now().toString();
    state.sessions.push({
        id:sid,
        title:"新对话",
        thinkMode:state.thinkMode,
        messages:[]
    });
    state.currentSessionId = sid;
    saveLocal();
    renderSessionList();
    renderChat(sid);
}
document.getElementById("newChatIcon").onclick = createSession;

//删除会话
function deleteSession(sid){
    state.sessions = state.sessions.filter(s=>s.id!==sid);
    if(state.currentSessionId===sid){
        state.currentSessionId = state.sessions.length>0?state.sessions[0].id:null;
    }
    saveLocal();
    renderSessionList();
    if(state.currentSessionId) renderChat(state.currentSessionId);
    else {chatBox.innerHTML="";chatBox.appendChild(welcomeDom);welcomeDom.style.display="flex";}
}

//渲染会话列表
function renderSessionList(){
    const el = document.getElementById("sessionList");
    el.innerHTML="";
    state.sessions.forEach(s=>{
        const div = document.createElement("div");
        div.className = "session‑item"+(state.currentSessionId===s.id?" active":"");
        const tag = s.thinkMode?"[R1] ":"";
        div.innerHTML = `<span>${escapeHtml(tag+s.title)}</span> <span class="del‑session">×</span>`;
        div.firstElementChild.onclick=()=>{
            state.currentSessionId = s.id;
            state.thinkMode = s.thinkMode;
            document.getElementById("toggleThink").classList.toggle("active",state.thinkMode);
            saveLocal();
            renderSessionList();
            renderChat(s.id);
            closeSidebar();
        }
        div.querySelector(".del‑session").onclick=(e)=>{e.stopPropagation();deleteSession(s.id);}
        el.appendChild(div);
    })
}

function escapeHtml(str){
    if(!str) return "";
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

//渲染聊天
function renderChat(sid){
    const ses = state.sessions.find(x=>x.id===sid);
    chatBox.innerHTML="";
    if(!ses) return;
    welcomeDom.style.display="none";
    ses.messages.forEach(m=>appendMsgDom(m.role,m.content,false));
    chatBox.scrollTop = chatBox.scrollHeight;
}

function appendMsgDom(role,content){
    const div = document.createElement("div");
    div.className = role==="user"?"message user‑msg":"message ai‑msg";
    div.innerText = content;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}

function updateTitle(sid,text){
    const s = state.sessions.find(x=>x.id===sid);
    if(s.title==="新对话"){
        s.title = text.slice(0,24);
        saveLocal();
        renderSessionList();
    }
}

async function sendChat(){
    const apiKey = document.getElementById("apiKeyInput").value.trim();
    const text = document.getElementById("promptInput").value.trim();
    const sendBtn = document.getElementById("sendBtn");
    if(!text) return;
    if(!apiKey){alert("请填入DeepSeek API Key");return;}
    if(!state.currentSessionId) createSession();
    const ses = state.sessions.find(x=>x.id===state.currentSessionId);
    ses.messages.push({role:"user",content:text});
    updateTitle(ses.id,text);
    saveLocal();
    renderChat(ses.id);
    document.getElementById("promptInput").value="";
    sendBtn.disabled=true;

    //模型选择：R1深度思考 / V3普通
    const modelName = ses.thinkMode ? "deepseek‑r1" : "deepseek‑chat";
    const history = [...ses.messages];
    let aiDom = appendMsgDom("assistant","");
    let fullText = "";

    try{
        const resp = await fetch("https://api.deepseek.com/v1/chat/completions",{
            method:"POST",
            headers:{"Content‑Type":"application/json","Authorization":`Bearer ${apiKey}`},
            body:JSON.stringify({
                model:modelName,
                messages:history,
                stream:true
            })
        })
        if(!resp.ok) throw new Error("HTTP "+resp.status);
        const reader = resp.body.getReader();
        const decoder = new TextDecoder("utf‑8");
        while(true){
            const {done,value} = await reader.read();
            if(done) break;
            const chunk = decoder.decode(value);
            const lines = chunk.split("\n").filter(l=>l.startsWith("data: ")&&l.trim()!="data: [DONE]");
            for(let line of lines){
                const jsonStr = line.replace("data: ","");
                try{
                    const obj = JSON.parse(jsonStr);
                    const delta = obj.choices?.[0]?.delta?.content;
                    if(delta){
                        fullText += delta;
                        aiDom.innerText = fullText;
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }catch(e){}
            }
        }
        ses.messages.push({role:"assistant",content:fullText});
        saveLocal();
    }catch(err){
        aiDom.innerText = "请求失败："+err.message+"\n检查Key、余额、网络";
    }
    sendBtn.disabled=false;
}

//事件绑定
document.getElementById("sendBtn").onclick = sendChat;
document.getElementById("promptInput").onkeydown = function(e){
    if(e.key==="Enter"&&!e.shiftKey){
        e.preventDefault();
        sendChat();
    }
}
document.getElementById("apiKeyInput").oninput = function(){
    state.apiKey = this.value.trim();
    saveLocal();
}

//初始化
loadLocal();
</script>
</body>
</html>
