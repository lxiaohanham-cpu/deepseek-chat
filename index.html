<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>DeepSeek AI 聊天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: #1a1a2e;
            color: white;
            padding: 12px 16px;
            padding-top: calc(12px + env(safe-area-inset-top));
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .header .api-status {
            font-size: 11px;
            font-weight: normal;
            margin-top: 3px;
            color: #4ade80;
        }
        
        .settings-bar {
            padding: 8px 10px;
            background: white;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #6b7280;
            flex-shrink: 0;
            border-bottom: 1px solid #e5e7eb;
            width: 100%;
        }
        
        .settings-bar label {
            font-size: 11px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .settings-bar input {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 7px 8px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
        }
        
        .settings-bar select {
            padding: 7px 2px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 11px;
            background: white;
            width: 80px;
            flex-shrink: 0;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
            width: 100%;
        }
        
        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .message.user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant {
            align-self: flex-start;
            background: white;
            color: #1a1a2e;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }
        
        .message.system {
            align-self: center;
            background: #e5e7eb;
            color: #6b7280;
            font-size: 12px;
            padding: 8px 12px;
            text-align: center;
            border-radius: 12px;
            max-width: 90%;
        }
        
        .input-container {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            background: white;
            border-top: 1px solid #e5e7eb;
            flex-shrink: 0;
            width: 100%;
        }
        
        #messageInput {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            min-width: 0;
        }
        
        #messageInput:focus {
            border-color: #2563eb;
        }
        
        #sendBtn {
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        #sendBtn:active {
            background: #1d4ed8;
        }
        
        #sendBtn:disabled {
            background: #9ca3af;
        }
        
        .loading-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        
        .loading-dots span {
            width: 6px;
            height: 6px;
            background: #2563eb;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        
        .error-msg {
            color: #ef4444 !important;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            🤖 DeepSeek AI 聊天
            <div class="api-status" id="apiStatus">未设置 API Key</div>
        </div>
        
        <div class="settings-bar">
            <label>Key:</label>
            <input type="password" id="apiKey" placeholder="粘贴API Key" 
                   oninput="saveApiKey(this.value)" autocomplete="off">
            <select id="modelSelect" onchange="saveModel(this.value)">
                <option value="deepseek-chat">chat</option>
                <option value="deepseek-reasoner">reasoner</option>
            </select>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message system">你好！请在上方输入 API Key 开始对话</div>
        </div>
        
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="输入消息..." 
                   onkeypress="if(event.key==='Enter') sendMessage()" autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('deepseek_api_key');
            const savedModel = localStorage.getItem('deepseek_model');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
                updateApiStatus(true);
            }
            if (savedModel) {
                document.getElementById('modelSelect').value = savedModel;
            }
        };
        
        function saveApiKey(key) {
            localStorage.setItem('deepseek_api_key', key);
            updateApiStatus(!!key);
        }
        
        function saveModel(model) {
            localStorage.setItem('deepseek_model', model);
        }
        
        function updateApiStatus(hasKey) {
            const statusEl = document.getElementById('apiStatus');
            statusEl.textContent = hasKey ? '✓ API Key 已设置' : '未设置 API Key';
            statusEl.style.color = hasKey ? '#4ade80' : '#f87171';
        }
        
        function addMessage(content, role) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + role;
            msgDiv.textContent = content;
            container.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }
        
        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            requestAnimationFrame(() => {
                container.scrollTop = container.scrollHeight;
            });
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('modelSelect').value;
            
            if (!message) return;
            if (!apiKey) {
                alert('请先输入你的 DeepSeek API Key');
                return;
            }
            
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            input.value = '';
            input.blur();
            
            addMessage(message, 'user');
            
            const aiMsg = addMessage('', 'assistant');
            aiMsg.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
            
            try {
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: 'user', content: message }
                        ],
                        stream: false,
                        max_tokens: 2000,
                        temperature: 0.7
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || '请求失败: ' + response.status);
                }
                
                const reply = data.choices[0].message.content;
                aiMsg.textContent = reply;
                
            } catch (error) {
                aiMsg.textContent = '错误: ' + error.message;
                aiMsg.classList.add('error-msg');
            }
            
            sendBtn.disabled = false;
            scrollToBottom();
        }
    </script>
</body>
</html>
